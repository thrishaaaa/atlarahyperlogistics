<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Careers Admin — Atlara</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg"/>
</head>
<body class="admin-page">
  <main class="admin-shell">
    <a href="index.html" class="admin-brand"><img src="assets/logo.jpg" alt="Atlara Hyperlogistics"/> <span>Careers Admin</span></a>

    <section id="loginView" class="admin-auth-card">
      <div class="tag">Secure access</div>
      <h1>Manage job openings</h1>
      <p>Sign in with the administrator account to publish and manage career opportunities.</p>
      <form id="loginForm">
        <div class="form-group"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required/></div>
        <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required/></div>
        <button class="btn btn-primary form-submit" type="submit">Sign in ↗</button>
        <p id="loginMessage" class="admin-message" role="alert"></p>
      </form>
    </section>

    <section id="dashboardView" class="admin-dashboard" hidden>
      <div class="admin-topbar">
        <div><div class="tag">Careers</div><h1>Job openings</h1><p>Publish changes instantly—no website redeploy needed.</p></div>
        <button id="logoutButton" class="btn btn-outline" type="button">Sign out</button>
      </div>

      <div class="admin-grid">
        <section class="admin-panel">
          <h2 id="formHeading">Add a job opening</h2>
          <form id="jobForm">
            <input id="jobId" type="hidden"/>
            <div class="form-group"><label for="jobCode">Job ID</label><input id="jobCode" type="text" maxlength="50" placeholder="e.g. ATL-0042 (fill in manually, optional)"/></div>
            <div class="form-group"><label for="title">Job title *</label><input id="title" type="text" required maxlength="150"/></div>
            <div class="form-row">
              <div class="form-group"><label for="department">Department *</label><input id="department" type="text" required maxlength="100"/></div>
              <div class="form-group"><label for="location">Location *</label><input id="location" type="text" required maxlength="100"/></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label for="type">Employment type *</label><select id="type" required><option value="">Select type</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option></select></div>
              <div class="form-group"><label for="closingDate">Applications close (optional)</label><input id="closingDate" type="date"/></div>
            </div>
            <div class="form-group"><label for="description">Role description *</label><textarea id="description" required maxlength="5000"></textarea></div>
            <div class="form-group"><label for="requirements">Requirements</label><textarea id="requirements" maxlength="5000" placeholder="Add one requirement per line"></textarea></div>
            <div class="form-group"><label for="status">Status *</label><select id="status" required><option value="draft">Draft — hidden from public page</option><option value="open">Open — visible on careers page</option><option value="closed">Closed — hidden from public page</option></select></div>
            <div class="admin-form-actions"><button id="saveButton" class="btn btn-primary" type="submit">Publish opening ↗</button><button id="cancelButton" class="btn btn-outline" type="button" hidden>Cancel edit</button></div>
            <p id="jobMessage" class="admin-message" role="alert"></p>
          </form>
        </section>

        <section class="admin-panel admin-list-panel">
          <div class="admin-list-heading"><h2>All postings</h2><button id="refreshButton" class="text-button" type="button">Refresh</button></div>
          <p id="jobsMessage" class="admin-message" role="status">Loading postings…</p>
          <div id="jobsList" class="admin-jobs-list"></div>
        </section>
      </div>

      <section class="admin-panel applicants-panel">
        <div class="admin-list-heading">
          <h2>Applicants</h2>
          <div class="applicants-panel__controls">
            <select id="applicantJobFilter" class="applicant-filter-select"><option value="all">All jobs</option></select>
            <button id="refreshApplicantsButton" class="text-button" type="button">Refresh</button>
          </div>
        </div>
        <p id="applicantsMessage" class="admin-message" role="status">Loading applicants…</p>
        <div id="applicantsList" class="applicant-groups"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
  <script>
    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const loginMessage = document.getElementById('loginMessage');
    const jobMessage = document.getElementById('jobMessage');
    const jobsMessage = document.getElementById('jobsMessage');
    const jobsList = document.getElementById('jobsList');
    const jobForm = document.getElementById('jobForm');
    const formHeading = document.getElementById('formHeading');
    const saveButton = document.getElementById('saveButton');
    const cancelButton = document.getElementById('cancelButton');
    let jobs = [];

    const STATUS_LABELS = {
      received: 'Received',
      under_review: 'Under consideration',
      waitlisted: 'Waitlisted',
      accepted: 'Accepted',
      rejected: 'Rejected'
    };

    function safeText(value) { const node = document.createElement('span'); node.textContent = value || ''; return node.innerHTML; }
    function showDashboard() { loginView.hidden = true; dashboardView.hidden = false; loadJobs(); loadApplicants(); }
    function resetForm() { jobForm.reset(); document.getElementById('jobId').value = ''; formHeading.textContent = 'Add a job opening'; saveButton.textContent = 'Publish opening ↗'; cancelButton.hidden = true; jobMessage.textContent = ''; }

    async function loadJobs() {
      jobsMessage.textContent = 'Loading postings…'; jobsList.innerHTML = '';
      const { data, error } = await window.sb.from('jobs').select('*').order('created_at', { ascending: false });
      if (error) { jobsMessage.textContent = 'Unable to load postings: ' + error.message; return; }
      jobs = data || [];
      if (!jobs.length) { jobsMessage.textContent = 'No job openings yet. Use the form to publish the first one.'; return; }
      jobsMessage.textContent = '';
      jobsList.innerHTML = jobs.map(job => {
        const closingLine = job.closing_date
          ? `<p style="font-size:.8rem;color:var(--accent-warm);margin-top:4px;">Closes ${new Date(job.closing_date + 'T00:00:00').toLocaleDateString()}</p>`
          : '';
        const shareButton = job.status === 'open'
          ? `<button class="text-button" type="button" data-share-job="${safeText(job.id)}" data-share-title="${safeText(job.title)}">Share</button>`
          : '';
        return `<article class="admin-job-card"><div><span class="job-status job-status--${safeText(job.status)}">${safeText(job.status)}</span>${job.job_code ? `<span class="job-status" style="margin-left:6px;background:rgba(13,159,189,.08);color:var(--ocean-teal);">ID: ${safeText(job.job_code)}</span>` : ''}<h3>${safeText(job.title)}</h3><p>${safeText(job.department)} · ${safeText(job.location)} · ${safeText(job.type)}</p>${closingLine}</div><div class="admin-job-actions">${shareButton}<button class="text-button" type="button" data-edit="${safeText(job.id)}">Edit</button><button class="text-button text-button--danger" type="button" data-delete="${safeText(job.id)}">Delete</button></div></article>`;
      }).join('');
      populateJobFilter();
    }

    function populateJobFilter() {
      const filter = document.getElementById('applicantJobFilter');
      const current = filter.value;
      filter.innerHTML = '<option value="all">All jobs</option>' + jobs.map(job => `<option value="${safeText(job.id)}">${safeText(job.job_code ? job.job_code + ' — ' : '')}${safeText(job.title)}</option>`).join('');
      if ([...filter.options].some(o => o.value === current)) filter.value = current;
    }

    jobForm.addEventListener('submit', async event => {
      event.preventDefault();
      const id = document.getElementById('jobId').value;
      const payload = {
        job_code: document.getElementById('jobCode').value.trim() || null,
        title: document.getElementById('title').value.trim(), department: document.getElementById('department').value.trim(),
        location: document.getElementById('location').value.trim(), type: document.getElementById('type').value,
        closing_date: document.getElementById('closingDate').value || null,
        description: document.getElementById('description').value.trim(), requirements: document.getElementById('requirements').value.trim(), status: document.getElementById('status').value
      };
      jobMessage.textContent = 'Saving…'; saveButton.disabled = true;
      const request = id ? window.sb.from('jobs').update(payload).eq('id', id) : window.sb.from('jobs').insert(payload);
      const { error } = await request;
      saveButton.disabled = false;
      if (error) { jobMessage.textContent = 'Could not save: ' + error.message; return; }
      resetForm(); jobMessage.textContent = id ? 'Job posting updated.' : 'Job opening published.'; loadJobs();
    });

    jobsList.addEventListener('click', async event => {
      const editId = event.target.dataset.edit, deleteId = event.target.dataset.delete;
      if (editId) {
        const job = jobs.find(item => item.id === editId); if (!job) return;
        Object.entries(job).forEach(([key, value]) => {
          const fieldId = key === 'job_code' ? 'jobCode' : key === 'closing_date' ? 'closingDate' : key;
          const input = document.getElementById(fieldId);
          if (input) input.value = value || '';
        });
        document.getElementById('jobId').value = job.id; formHeading.textContent = 'Edit job opening'; saveButton.textContent = 'Save changes ↗'; cancelButton.hidden = false; jobMessage.textContent = ''; window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      if (deleteId && confirm('Delete this job posting permanently? Its applicants will also be removed.')) { const { error } = await window.sb.from('jobs').delete().eq('id', deleteId); jobsMessage.textContent = error ? 'Could not delete: ' + error.message : 'Job posting deleted.'; loadJobs(); loadApplicants(); }
    });

    document.getElementById('loginForm').addEventListener('submit', async event => { event.preventDefault(); loginMessage.textContent = 'Signing in…'; const { error } = await window.sb.auth.signInWithPassword({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value }); if (error) { loginMessage.textContent = error.message; return; } showDashboard(); });
    document.getElementById('logoutButton').addEventListener('click', async () => { await window.sb.auth.signOut(); dashboardView.hidden = true; loginView.hidden = false; document.getElementById('loginForm').reset(); });
    document.getElementById('refreshButton').addEventListener('click', loadJobs);
    cancelButton.addEventListener('click', resetForm);

    // ── Applicants ──────────────────────────────────────────────────────────
    const applicantsMessage = document.getElementById('applicantsMessage');
    const applicantsList = document.getElementById('applicantsList');
    let applications = [];

    async function loadApplicants() {
      applicantsMessage.textContent = 'Loading applicants…';
      const { data, error } = await window.sb
        .from('applications')
        .select('*, jobs(title, job_code)')
        .order('created_at', { ascending: false });
      if (error) { applicantsMessage.textContent = 'Unable to load applicants: ' + error.message; return; }
      applications = data || [];
      renderApplicants();
    }

    function renderApplicants() {
      const filterValue = document.getElementById('applicantJobFilter').value;
      const filtered = filterValue === 'all' ? applications : applications.filter(a => a.job_id === filterValue);

      if (!filtered.length) {
        applicantsMessage.textContent = applications.length ? 'No applicants for this job yet.' : 'No applications have been submitted yet.';
        applicantsList.innerHTML = '';
        return;
      }
      applicantsMessage.textContent = '';

      const groups = {};
      filtered.forEach(app => {
        const key = app.job_id;
        if (!groups[key]) groups[key] = { title: (app.jobs && app.jobs.title) || app.job_title, jobCode: app.jobs && app.jobs.job_code, items: [] };
        groups[key].items.push(app);
      });

      applicantsList.innerHTML = Object.values(groups).map(group => `
        <div class="applicant-group">
          <h3 class="applicant-group__title">${safeText(group.jobCode ? group.jobCode + ' — ' : '')}${safeText(group.title)} <span class="applicant-group__count">${group.items.length} applicant${group.items.length === 1 ? '' : 's'}</span></h3>
          ${group.items.map(app => `
            <article class="applicant-card" data-id="${safeText(app.id)}">
              <div class="applicant-card__main">
                <div class="applicant-card__name">${safeText(app.first_name)} ${safeText(app.last_name)}</div>
                <div class="applicant-card__meta">
                  <span><a href="mailto:${safeText(app.email)}">${safeText(app.email)}</a></span>
                  <span>${safeText(app.phone)}</span>
                  ${app.age ? `<span>Age ${safeText(String(app.age))}</span>` : ''}
                  ${app.gender ? `<span>${safeText(app.gender)}</span>` : ''}
                  <span>${new Date(app.created_at).toLocaleDateString()}</span>
                </div>
                ${app.message ? `<p class="applicant-card__note">${safeText(app.message)}</p>` : ''}
                <button class="text-button applicant-resume-btn" type="button" data-path="${safeText(app.resume_path)}">📄 View resume</button>
              </div>
              <div class="applicant-card__status">
                <label class="applicant-status-label">Status</label>
                <select class="applicant-status-select" data-id="${safeText(app.id)}">
                  ${Object.entries(STATUS_LABELS).map(([value, label]) => `<option value="${value}" ${app.status === value ? 'selected' : ''}>${label}</option>`).join('')}
                </select>
              </div>
            </article>
          `).join('')}
        </div>
      `).join('');
    }

    applicantsList.addEventListener('change', async event => {
      if (!event.target.classList.contains('applicant-status-select')) return;
      const select = event.target;
      const id = select.dataset.id;
      const newStatus = select.value;
      select.disabled = true;
      const { error } = await window.sb.from('applications').update({ status: newStatus }).eq('id', id);
      select.disabled = false;
      if (error) { alert('Could not update status: ' + error.message); return; }
      const app = applications.find(a => a.id === id);
      if (app) app.status = newStatus;
      applicantsMessage.textContent = 'Status updated — the applicant will be notified by email.';
      setTimeout(() => { if (applicantsMessage.textContent.startsWith('Status updated')) applicantsMessage.textContent = ''; }, 3500);
    });

    applicantsList.addEventListener('click', async event => {
      if (!event.target.classList.contains('applicant-resume-btn')) return;
      const path = event.target.dataset.path;
      if (!path) return;
      event.target.textContent = 'Opening…';
      const { data, error } = await window.sb.storage.from('resumes').createSignedUrl(path, 300);
      event.target.textContent = '📄 View resume';
      if (error || !data) { alert('Could not open resume: ' + (error ? error.message : 'unknown error')); return; }
      window.open(data.signedUrl, '_blank', 'noopener');
    });

    document.getElementById('applicantJobFilter').addEventListener('change', renderApplicants);
    document.getElementById('refreshApplicantsButton').addEventListener('click', loadApplicants);

    window.sb.auth.getSession().then(({ data: { session } }) => { if (session) showDashboard(); });
  </script>
</body>
</html>
